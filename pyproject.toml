[project]
name = "pixelphilly"
version = "0.1.0"
description = "Pilot: isometric pixel-art map of Philadelphia from city open data"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyproj",
    "shapely",
    "numpy",
    "pillow",
    "playwright",
    "google-genai",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "pyvips[binary]>=3.2.0",
    "laspy>=2.7.0",
    "rasterio>=1.5.2",
    "pyshp>=3.1.6",
    "imageio-ffmpeg>=0.8.1",
]

[dependency-groups]
dev = ["pytest"]
# Phase 2: Modal client (GPU jobs run remotely) and CPU torch for the sampler tests
gpu = ["modal", "torch"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelphilly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
