[project]
name = "pixelphilly"
version = "0.1.0"
description = "Pilot: isometric pixel-art map of Philadelphia from city open data"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "pyproj",
    "shapely",
    "numpy",
    "pillow",
    "playwright",
    "google-genai",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixelphilly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
